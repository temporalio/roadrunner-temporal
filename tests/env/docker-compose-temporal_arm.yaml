version: "3.8"
services:
  # CLI dev server (bundles server 1.31.2): in-memory SQLite, auto-created "default"
  # namespace, no schema setup. auto-setup images are frozen at 1.29.x and never got 1.3x.
  temporal:
    container_name: temporal
    image: temporalio/temporal:1.8.2
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--headless"]
    networks:
      - temporal-network
    ports:
      - 7233:7233

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:1
    networks:
      - temporal-network
    stdin_open: true
    tty: true
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:latest
    networks:
      - temporal-network
    ports:
      - 8080:8080
networks:
  temporal-network:
    driver: bridge
    name: temporal-network
