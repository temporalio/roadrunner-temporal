version: "3"

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"

  statsd:
    image: statsd/statsd
    ports:
      - "8125:8125/udp"
      - "8126:8126"

  envoy:
    image: bitnamilegacy/envoy:latest
    ports:
      - "4433:443"
    volumes:
      - ./h2c.yaml:/opt/bitnami/envoy/conf/envoy.yaml
      - ./temporal_tls/certs/client.pem:/etc/envoy/client.pem
      - ./temporal_tls/certs/client.key:/etc/envoy/client.key
      - ./temporal_tls/certs/ca.cert:/etc/envoy/ca.cert

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"

  # CLI dev server (bundles server 1.31.2): in-memory SQLite, auto-created "default"
  # namespace, no schema setup. auto-setup images are frozen at 1.29.x and never got 1.3x.
  temporal:
    container_name: temporal
    image: temporalio/temporal:1.8.2
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7233", "--headless"]
    ports:
      - "7233:7233"

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - LOG_LEVEL=debug
    stdin_open: true
    tty: true
