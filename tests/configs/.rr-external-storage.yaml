version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php ../php_test_files/worker.php"

temporal:
  address: "127.0.0.1:7233"
  cache_size: 10
  external_storage:
    payload_size_threshold: 1024
    s3:
      bucket: payloads
      region: us-east-1
      endpoint: ${S3_ENDPOINT}
      force_path_style: true
      key: test
      secret: test
  activities:
    num_workers: 2

logs:
  mode: development
  level: debug
